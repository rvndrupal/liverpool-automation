name: Liverpool E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite correrlo manualmente desde GitHub

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias npm
      - name: Install dependencies
        run: npm ci

      # 4. Instalar Chromium de Playwright
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 5. Correr los tests en headless (default)
      - name: Run Playwright tests
        run: npm test
        env:
          SEARCH_TERM: 'playstation 5'
          COLOR_FILTER: 'Blanco'
          RESULT_COUNT: '5'

      # 6. Subir el reporte HTML como artefacto (siempre, aunque fallen los tests)
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 7. Subir los reportes Word generados
      - name: Upload Word reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-reports
          path: reports/
          retention-days: 30

      # 8. Subir screenshots/videos en caso de fallo
      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
